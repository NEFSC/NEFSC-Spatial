url: https://nefsc.github.io/NEFSC-Spatial/

template:
 bootstrap: 3

deploy:
  install_metadata: true

navbar:
  structure:
    left:
    - home
    - getting started
    - reference
    - issue
    - articles
    right:
    - search
    - github
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
      aria-label: Home
    getting started:
      text: Getting Started
      icon: fas fa-solid fa-play
      href: articles/NEFSCspatial.html
    reference:
      text: Data
      icon: fas fa-database fa-lg
      href: reference/index.html
    issue:
      text: Issues
      icon: fas fa-question-circle fa-lg
      href: https://github.com/NEFSC/NEFSC-Spatial/issues
    articles:
      text: Articles
      icon: fas fa-file-contract fa-lg
      menu:
      - text: Contributing to Package
        href: articles/ContributeSpatialData.html
      - text: Team Members
        href: articles/teamMembers.html
reference:
- title: Fishing Areas / Management Areas
  desc: Areas in which fishing is reported
- contents:
  - starts_with("Statistical_")
  - starts_with("NAFO_")
  - "final_mass_inshore_stat"
  - "Herring_Management_Areas"
  - "epu_sf"
- title: Closed Areas
  desc: Areas in which fishing is restricted
- contents:
  - GillnetClosureAreas_20211021
  - LMA1_Restricted_Area_FR
  - Great_South_Channel_Restricted_Trap_Pot_Area
  - Scallop_Rotational_Areas_20230411
- title: Protected Species
- contents: amapps_grid
- title: Survey Strata
  desc: Areas in which survey sampling is reported
- contents:
  - BTS_Strata
  - EcoMon_Strata
  - Shellfish_Strata
  - Shrimp_Strata
- title: Models
  desc: Areas defining model boundaries
- contents: Neus_atlantis
authors:
  Andy Beet:
    href: https://andybeet.com
  Kimberly Bastille:
    href: https://github.com/kimberly-bastille
  Joshua Hatch:
    href: https://github.com/jmhatch-NOAA
